# AST2700 DisplayPort controller and DPMCU control registers.

block/DP:
  description: AST2700 DisplayPort transmitter controller registers.
  items:
    - { name: CPU_INTR_CTRL, byte_offset: 0x000, fieldset: INTR_CTRL, description: Interrupt-to-CPU configuration. }
    - { name: CPU_INTR_STATUS, byte_offset: 0x004, access: Read, fieldset: INTR_STATUS, description: Interrupt-to-CPU status. }
    - { name: CPU_SW_INTR_CTRL, byte_offset: 0x008, fieldset: SW_INTR_CTRL, description: Software interrupt-to-CPU configuration. }
    - { name: CPU_SW_INTR_STATUS, byte_offset: 0x00c, access: Read, fieldset: SW_INTR_STATUS, description: Software interrupt-to-CPU status. }
    - { name: CPU_TIMER0_CTRL, byte_offset: 0x010, fieldset: TIMER_CTRL, description: CPU timer 0 warning configuration. }
    - { name: CPU_TIMER0_RELOAD, byte_offset: 0x014, fieldset: TIMER_RELOAD, description: CPU timer 0 reload configuration. }
    - { name: CPU_TIMER0_STATUS, byte_offset: 0x018, fieldset: TIMER_STATUS, description: CPU timer 0 status and current count. }
    - { name: VERSION, byte_offset: 0x01c, access: Read, description: DisplayPort controller version register. }
    - { name: CPU_TIMER1_CTRL, byte_offset: 0x020, fieldset: TIMER_CTRL, description: CPU timer 1 warning configuration. }
    - { name: CPU_TIMER1_RELOAD, byte_offset: 0x024, fieldset: TIMER_RELOAD, description: CPU timer 1 reload configuration. }
    - { name: CPU_TIMER1_STATUS, byte_offset: 0x028, fieldset: TIMER_STATUS, description: CPU timer 1 status and current count. }
    - { name: MCU_INTR_CTRL, byte_offset: 0x040, fieldset: INTR_CTRL, description: Interrupt-to-MCU configuration. }
    - { name: MCU_INTR_STATUS, byte_offset: 0x044, access: Read, fieldset: INTR_STATUS, description: Interrupt-to-MCU status. }
    - { name: MCU_SW_INTR_CTRL, byte_offset: 0x048, fieldset: SW_INTR_CTRL, description: Software interrupt-to-MCU configuration. }
    - { name: MCU_SW_INTR_STATUS, byte_offset: 0x04c, access: Read, fieldset: SW_INTR_STATUS, description: Software interrupt-to-MCU status. }
    - { name: MCU_TIMER0_CTRL, byte_offset: 0x050, fieldset: TIMER_CTRL, description: MCU timer 0 warning configuration. }
    - { name: MCU_TIMER0_RELOAD, byte_offset: 0x054, fieldset: TIMER_RELOAD, description: MCU timer 0 reload configuration. }
    - { name: MCU_TIMER0_STATUS, byte_offset: 0x058, fieldset: TIMER_STATUS, description: MCU timer 0 status and current count. }
    - { name: MCU_TIMER1_CTRL, byte_offset: 0x060, fieldset: TIMER_CTRL, description: MCU timer 1 warning configuration. }
    - { name: MCU_TIMER1_RELOAD, byte_offset: 0x064, fieldset: TIMER_RELOAD, description: MCU timer 1 reload configuration. }
    - { name: MCU_TIMER1_STATUS, byte_offset: 0x068, fieldset: TIMER_STATUS, description: MCU timer 1 status and current count. }
    - { name: HPD_STATUS, byte_offset: 0x07c, access: Read, fieldset: HPD_STATUS, description: Hot-plug detect status. }
    - { name: HPD_IRQ_CFG, byte_offset: 0x080, fieldset: HPD_IRQ_CFG, description: HPD IRQ low-period bounds. }
    - { name: HPD_EVENT_CFG, byte_offset: 0x084, fieldset: HPD_EVENT_CFG, description: HPD event low-period threshold. }
    - { name: AUX_REQ_CTRL, byte_offset: 0x088, fieldset: AUX_REQ_CTRL, description: AUX request command control and status. }
    - { name: AUX_REQ_ADDR, byte_offset: 0x08c, fieldset: AUX_REQ_ADDR, description: AUX request length and address. }
    - { name: AUX_REQ_DATA, byte_offset: 0x090, array: { len: 4, stride: 4 }, description: AUX request data bytes 0..15. }
    - { name: AUX_REPLY_DATA, byte_offset: 0x0a0, access: Read, array: { len: 4, stride: 4 }, description: AUX reply data bytes 0..15. }
    - { name: AUX_REPLY_STATUS, byte_offset: 0x0b0, access: Read, fieldset: AUX_REPLY_STATUS, description: AUX reply command and status. }
    - { name: AUX_REPLY_CFG, byte_offset: 0x0b4, fieldset: AUX_REPLY_CFG, description: AUX reply timeout and loopback configuration. }
    - { name: HANDSHAKE, byte_offset: 0x0b8, fieldset: HANDSHAKE, description: Display ownership and EDID handoff control. }
    - { name: LINK_CFG, byte_offset: 0x0c0, fieldset: LINK_CFG, description: Main link configuration. }
    - { name: LINK_MVID_HW, byte_offset: 0x0c4, fieldset: LINK_MVID_HW, description: Hardware MVID and VB-ID configuration. }
    - { name: MSA_MVID, byte_offset: 0x0c8, fieldset: MSA_24, description: MSA MVID set by firmware. }
    - { name: MSA_NVID, byte_offset: 0x0cc, fieldset: MSA_24, description: MSA NVID. }
    - { name: MSA_TOTAL, byte_offset: 0x0d0, fieldset: MSA_PAIR, description: MSA vertical and horizontal total. }
    - { name: MSA_START, byte_offset: 0x0d4, fieldset: MSA_PAIR, description: MSA vertical and horizontal start. }
    - { name: MSA_SIZE, byte_offset: 0x0d8, fieldset: MSA_PAIR, description: MSA vertical height and horizontal width. }
    - { name: MSA_SYNC, byte_offset: 0x0dc, fieldset: MSA_PAIR, description: MSA vertical and horizontal sync width. }
    - { name: MSA_MISC, byte_offset: 0x0e0, fieldset: MSA_MISC, description: MSA misc0 and misc1 packet bytes. }
    - { name: TRAINING_PATTERN, byte_offset: 0x0e4, fieldset: TRAINING_PATTERN, description: Link training and quality pattern configuration. }
    - { name: DIGITAL_PHY_CFG, byte_offset: 0x0e8, fieldset: DIGITAL_PHY_CFG, description: Main link digital PHY configuration. }
    - { name: CUSTOM_PATTERN, byte_offset: 0x0ec, array: { len: 3, stride: 4 }, description: 80-bit custom encoder test pattern. }
    - { name: LINK_FW_CFG, byte_offset: 0x0f8, fieldset: LINK_FW_CFG, description: Firmware-defined main link configuration. }
    - { name: LINK_STATUS, byte_offset: 0x0fc, fieldset: LINK_STATUS, description: Link training and packet FSM status. }
    - { name: TX_CFG, byte_offset: 0x100, fieldset: TX_CFG, description: DisplayPort transmitter reset and clock configuration. }
    - { name: PHY_CTRL, byte_offset: 0x104, fieldset: PHY_CTRL, description: DP PHY power, reset, AUX, and main-link control. }
    - { name: PHY_LANE_CFG, byte_offset: 0x108, fieldset: PHY_LANE_CFG, description: DP PHY lane swing, pre-emphasis, and rate configuration. }
    - { name: PHY_AUX_STATUS, byte_offset: 0x10c, access: Read, fieldset: PHY_AUX_STATUS, description: DP PHY AUX status. }
    - { name: PHY_VENDOR_CFG0, byte_offset: 0x110, fieldset: PHY_VENDOR_CFG0, description: DP PHY vendor control and debug selection. }
    - { name: PHY_VENDOR_STATUS, byte_offset: 0x114, access: Read, fieldset: PHY_VENDOR_STATUS, description: DP PHY vendor status. }
    - { name: PHY_VENDOR_CFG, byte_offset: 0x118, array: { len: 5, stride: 4 }, description: DP PHY vendor reserved configuration words. }
    - { name: PHY_CLK_CFG, byte_offset: 0x12c, fieldset: PHY_CLK_CFG, description: DP PHY reference clock selection. }
    - { name: PHY_RXDATA_LATCH, byte_offset: 0x138, fieldset: PHY_RXDATA_LATCH, description: Feedback symbol latch command and shift selection. }
    - { name: PHY_RXDATA_LATCH_AUTO, byte_offset: 0x13c, access: Read, fieldset: PHY_RXDATA_LATCH_AUTO, description: Automatic feedback symbol shift selection. }
    - { name: PHY_MAIN0_RXDATA, byte_offset: 0x140, access: Read, array: { len: 4, stride: 4 }, description: Latched feedback symbols for lane 0. }
    - { name: PHY_MAIN1_RXDATA, byte_offset: 0x150, access: Read, array: { len: 4, stride: 4 }, description: Latched feedback symbols for lane 1. }
    - { name: VGA_INTR_CTRL, byte_offset: 0x160, fieldset: INTR_CTRL, description: Interrupt-to-VGA configuration. }
    - { name: VGA_INTR_STATUS, byte_offset: 0x164, access: Read, fieldset: INTR_STATUS, description: Interrupt-to-VGA status. }
    - { name: VGA_SW_INTR_CTRL, byte_offset: 0x168, fieldset: SW_INTR_CTRL, description: Software interrupt-to-VGA configuration. }
    - { name: VGA_SW_INTR_STATUS, byte_offset: 0x16c, access: Read, fieldset: SW_INTR_STATUS, description: Software interrupt-to-VGA status. }
    - { name: VIDEO_LINEBUF_CFG, byte_offset: 0x180, fieldset: VIDEO_LINEBUF_CFG, description: Video line buffer configuration. }

block/DPMCU_DMEM:
  description: >
    DisplayPort MCU data memory window used for runtime handoff state.
  items:
    - name: DISPLAY_FORMAT
      description: Display format and region enable handoff word.
      byte_offset: 0x0de0

block/DPMCU_REG:
  description: >
    DisplayPort MCU control register window.
  items:
    - { name: REG_BANK, byte_offset: 0x000, access: Read, array: { len: 32, stride: 4 }, description: DP MCU register bank words 0..31. }
    - { name: PAUSE_CTRL, byte_offset: 0x080, fieldset: DPMCU_PAUSE_CTRL, description: DP MCU pause control and status. }
    - { name: BREAKPOINT, byte_offset: 0x084, fieldset: DPMCU_BREAKPOINT, description: DP MCU program-counter breakpoint configuration. }
    - { name: PC_NEXT, byte_offset: 0x088, access: Read, fieldset: DPMCU_PC, description: DP MCU next program counter. }
    - { name: PC_CURRENT, byte_offset: 0x08c, access: Read, fieldset: DPMCU_PC, description: DP MCU current program counter. }
    - { name: INST_NEXT, byte_offset: 0x090, access: Read, description: Instruction at the next program counter. }
    - { name: INST_CURRENT, byte_offset: 0x094, access: Read, description: Instruction at the current program counter. }
    - { name: INT_ENABLE_STATUS, byte_offset: 0x098, access: Read, description: Interrupt enable bits controlled by DPMCU INTEN. }
    - { name: INT_SOURCE_STATUS, byte_offset: 0x09c, access: Read, description: Interrupt sources viewed by DP MCU. }
    - { name: VERSION, byte_offset: 0x0d0, access: Read, description: DP MCU version. }
    - { name: CTRL, byte_offset: 0x0e0, fieldset: MCU_CTRL, description: DisplayPort MCU memory, bus, and core reset control. }
    - { name: INTR_CTRL, byte_offset: 0x0e8, fieldset: MCU_INTR_CTRL, description: DisplayPort MCU interrupt clear, mask, and enable control. }
    - { name: INTR_STATUS, byte_offset: 0x0ec, access: Read, fieldset: MCU_INTR_STATUS, description: DisplayPort MCU interrupt status. }

fieldset/HANDSHAKE:
  description: DisplayPort handshake register.
  fields:
    - { name: VIDEO_FMT_SRC, bit_offset: 24, bit_size: 1, description: Video format source selection. }
    - { name: HOST_READ_EDID, bit_offset: 28, bit_size: 1, description: Host EDID read handoff control. }

