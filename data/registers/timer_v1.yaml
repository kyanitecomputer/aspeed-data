# AST2600 Hardware Timer registers.
#
# Timer base (CM3 view): 0x7E78_2000.
# 8 × 32-bit countdown timers.  Timer units: PCLK ticks or 1 MHz.
#
# Register layout:
#   Timers 1-3: STATUS/RELOAD/MATCH1 at 0x00–0x08, 0x10–0x18, 0x20–0x28
#   [GAP 0x30–0x3F: global control and interrupt registers]
#   Timers 4-8: STATUS/RELOAD/MATCH1 at 0x40–0x48, 0x50–0x58, ..., 0x80–0x88
#   Per-timer stride: 0x10 (16 bytes).
#
# Global control (shared):
#   TMC30 (0x30): Control Register (set-1, clear via TMC3C)
#   TMC34 (0x34): Interrupt Status Register (RW1C)
#   TMC3C (0x3C): TMC30 Clear Register (W1C)
#
# TMC30 bit layout (4 bits per timer, LSB first):
#   bits [3:0]   = timer 1: [WDT_EN, OVF_INTR, CLK_SEL, EN]
#   bits [7:4]   = timer 2: same pattern
#   ...
#   bits [31:28] = timer 8: same pattern
#
# TMC34 bit layout: bit N-1 = timer N interrupt event (N = 1..8)
#
# Sources:
#   ast2600.md v1.6  Chapter 43 – Timer/Counter (TMC00–TMC8C, TMC30–TMC3C)

block/TIMER:
  description: >
    AST2600 hardware timer block.
    Base: 0x7E78_2000 (CM3 view).  8 × 32-bit countdown timers.
  items:
    # ── Timer 1 ──────────────────────────────────────────────────────────────
    - name: T1_STATUS
      description: Timer 1 Counter Status (TMC00). Read-only current count.
      byte_offset: 0x00
      fieldset: TMC_COUNTER
    - name: T1_RELOAD
      description: Timer 1 Reload Value (TMC04). Loaded on enable or overflow.
      byte_offset: 0x04
      fieldset: TMC_COUNTER
    - name: T1_MATCH1
      description: Timer 1 First Match Register (TMC08).
      byte_offset: 0x08
      fieldset: TMC_COUNTER

    # ── Timer 2 ──────────────────────────────────────────────────────────────
    - name: T2_STATUS
      description: Timer 2 Counter Status (TMC10).
      byte_offset: 0x10
      fieldset: TMC_COUNTER
    - name: T2_RELOAD
      description: Timer 2 Reload Value (TMC14).
      byte_offset: 0x14
      fieldset: TMC_COUNTER
    - name: T2_MATCH1
      description: Timer 2 First Match Register (TMC18).
      byte_offset: 0x18
      fieldset: TMC_COUNTER

    # ── Timer 3 ──────────────────────────────────────────────────────────────
    - name: T3_STATUS
      description: Timer 3 Counter Status (TMC20).
      byte_offset: 0x20
      fieldset: TMC_COUNTER
    - name: T3_RELOAD
      description: Timer 3 Reload Value (TMC24).
      byte_offset: 0x24
      fieldset: TMC_COUNTER
    - name: T3_MATCH1
      description: Timer 3 First Match Register (TMC28).
      byte_offset: 0x28
      fieldset: TMC_COUNTER

    # ── Global control (gap at 0x30–0x3C) ────────────────────────────────────
    - name: CTRL
      description: >
        Global Timer Control Register (TMC30).
        Write 1 to set specific bits; write 1 to TMC3C to clear.
        4 bits per timer: [WDT_EN, OVF_INTR, CLK_SEL, EN], timer 1 in bits [3:0].
      byte_offset: 0x30
      fieldset: TMC_CTRL

    - name: INT_STATUS
      description: >
        Timer Interrupt Status Register (TMC34). RW1C.
        Bit N-1 set when timer N overflows and OVF_INTR is enabled.
        Clear by writing 1 to the bit.
      byte_offset: 0x34
      fieldset: TMC_INT_STATUS

    - name: CTRL_CLR
      description: >
        TMC30 Clear Register (TMC3C). Write-only.
        Write 1 to a bit to clear the same bit in CTRL (TMC30).
      byte_offset: 0x3C
      fieldset: TMC_CTRL

    # ── Timer 4 ──────────────────────────────────────────────────────────────
    - name: T4_STATUS
      description: Timer 4 Counter Status (TMC40).
      byte_offset: 0x40
      fieldset: TMC_COUNTER
    - name: T4_RELOAD
      description: Timer 4 Reload Value (TMC44).
      byte_offset: 0x44
      fieldset: TMC_COUNTER
    - name: T4_MATCH1
      description: Timer 4 First Match Register (TMC48).
      byte_offset: 0x48
      fieldset: TMC_COUNTER

    # ── Timer 5 ──────────────────────────────────────────────────────────────
    - name: T5_STATUS
      description: Timer 5 Counter Status (TMC50).
      byte_offset: 0x50
      fieldset: TMC_COUNTER
    - name: T5_RELOAD
      description: Timer 5 Reload Value (TMC54).
      byte_offset: 0x54
      fieldset: TMC_COUNTER
    - name: T5_MATCH1
      description: Timer 5 First Match Register (TMC58).
      byte_offset: 0x58
      fieldset: TMC_COUNTER

    # ── Timer 6 ──────────────────────────────────────────────────────────────
    - name: T6_STATUS
      description: Timer 6 Counter Status (TMC60).
      byte_offset: 0x60
      fieldset: TMC_COUNTER
    - name: T6_RELOAD
      description: Timer 6 Reload Value (TMC64).
      byte_offset: 0x64
      fieldset: TMC_COUNTER
    - name: T6_MATCH1
      description: Timer 6 First Match Register (TMC68).
      byte_offset: 0x68
      fieldset: TMC_COUNTER

    # ── Timer 7 ──────────────────────────────────────────────────────────────
    - name: T7_STATUS
      description: Timer 7 Counter Status (TMC70).
      byte_offset: 0x70
      fieldset: TMC_COUNTER
    - name: T7_RELOAD
      description: Timer 7 Reload Value (TMC74).
      byte_offset: 0x74
      fieldset: TMC_COUNTER
    - name: T7_MATCH1
      description: Timer 7 First Match Register (TMC78).
      byte_offset: 0x78
      fieldset: TMC_COUNTER

    # ── Timer 8 ──────────────────────────────────────────────────────────────
    - name: T8_STATUS
      description: Timer 8 Counter Status (TMC80).
      byte_offset: 0x80
      fieldset: TMC_COUNTER
    - name: T8_RELOAD
      description: Timer 8 Reload Value (TMC84).
      byte_offset: 0x84
      fieldset: TMC_COUNTER
    - name: T8_MATCH1
      description: Timer 8 First Match Register (TMC88).
      byte_offset: 0x88
      fieldset: TMC_COUNTER

# ── Fieldsets ──────────────────────────────────────────────────────────────────

fieldset/TMC_COUNTER:
  description: 32-bit timer counter or reload value.
  fields:
    - name: VALUE
      description: Counter / reload value (32-bit).
      bit_offset: 0
      bit_size: 32

fieldset/TMC_CTRL:
  description: >
    Global Timer Control Register (TMC30 / TMC3C).
    4 bits per timer. Bit layout for timer N (N=1..8), starting at bit (N-1)*4:
      bit+0: EN         — timer enable (0=disable, 1=enable)
      bit+1: CLK_SEL    — clock source (0=PCLK, 1=1 MHz)
      bit+2: OVF_INTR   — overflow interrupt enable
      bit+3: WDT_EN     — WDT tolerance (can be reset by WDT)
    Write '1' to TMC30 to set bits; write '1' to TMC3C to clear bits.
  fields:
    - name: T1_EN
      description: Timer 1 enable.
      bit_offset: 0
      bit_size: 1
    - name: T1_CLK_SEL
      description: "Timer 1 clock source: 0=PCLK, 1=1 MHz."
      bit_offset: 1
      bit_size: 1
    - name: T1_OVF_INTR
      description: Timer 1 overflow interrupt enable.
      bit_offset: 2
      bit_size: 1
    - name: T1_WDT_EN
      description: Timer 1 WDT tolerance.
      bit_offset: 3
      bit_size: 1
    - name: T2_EN
      description: Timer 2 enable.
      bit_offset: 4
      bit_size: 1
    - name: T2_CLK_SEL
      description: "Timer 2 clock source: 0=PCLK, 1=1 MHz."
      bit_offset: 5
      bit_size: 1
    - name: T2_OVF_INTR
      description: Timer 2 overflow interrupt enable.
      bit_offset: 6
      bit_size: 1
    - name: T2_WDT_EN
      description: Timer 2 WDT tolerance.
      bit_offset: 7
      bit_size: 1
    - name: T3_EN
      description: Timer 3 enable.
      bit_offset: 8
      bit_size: 1
    - name: T3_CLK_SEL
      description: "Timer 3 clock source: 0=PCLK, 1=1 MHz."
      bit_offset: 9
      bit_size: 1
    - name: T3_OVF_INTR
      description: Timer 3 overflow interrupt enable.
      bit_offset: 10
      bit_size: 1
    - name: T3_WDT_EN
      description: Timer 3 WDT tolerance.
      bit_offset: 11
      bit_size: 1
    - name: T4_EN
      description: Timer 4 enable.
      bit_offset: 12
      bit_size: 1
    - name: T4_CLK_SEL
      description: "Timer 4 clock source: 0=PCLK, 1=1 MHz."
      bit_offset: 13
      bit_size: 1
    - name: T4_OVF_INTR
      description: Timer 4 overflow interrupt enable.
      bit_offset: 14
      bit_size: 1
    - name: T4_WDT_EN
      description: Timer 4 WDT tolerance.
      bit_offset: 15
      bit_size: 1
    - name: T5_EN
      description: Timer 5 enable.
      bit_offset: 16
      bit_size: 1
    - name: T5_CLK_SEL
      description: "Timer 5 clock source: 0=PCLK, 1=1 MHz."
      bit_offset: 17
      bit_size: 1
    - name: T5_OVF_INTR
      description: Timer 5 overflow interrupt enable.
      bit_offset: 18
      bit_size: 1
    - name: T5_WDT_EN
      description: Timer 5 WDT tolerance.
      bit_offset: 19
      bit_size: 1
    - name: T6_EN
      description: Timer 6 enable.
      bit_offset: 20
      bit_size: 1
    - name: T6_CLK_SEL
      description: "Timer 6 clock source: 0=PCLK, 1=1 MHz."
      bit_offset: 21
      bit_size: 1
    - name: T6_OVF_INTR
      description: Timer 6 overflow interrupt enable.
      bit_offset: 22
      bit_size: 1
    - name: T6_WDT_EN
      description: Timer 6 WDT tolerance.
      bit_offset: 23
      bit_size: 1
    - name: T7_EN
      description: Timer 7 enable.
      bit_offset: 24
      bit_size: 1
    - name: T7_CLK_SEL
      description: "Timer 7 clock source: 0=PCLK, 1=1 MHz."
      bit_offset: 25
      bit_size: 1
    - name: T7_OVF_INTR
      description: Timer 7 overflow interrupt enable.
      bit_offset: 26
      bit_size: 1
    - name: T7_WDT_EN
      description: Timer 7 WDT tolerance.
      bit_offset: 27
      bit_size: 1
    - name: T8_EN
      description: Timer 8 enable.
      bit_offset: 28
      bit_size: 1
    - name: T8_CLK_SEL
      description: "Timer 8 clock source: 0=PCLK, 1=1 MHz."
      bit_offset: 29
      bit_size: 1
    - name: T8_OVF_INTR
      description: Timer 8 overflow interrupt enable.
      bit_offset: 30
      bit_size: 1
    - name: T8_WDT_EN
      description: Timer 8 WDT tolerance.
      bit_offset: 31
      bit_size: 1

fieldset/TMC_INT_STATUS:
  description: >
    Timer Interrupt Status Register (TMC34). RW1C.
    Bit N-1 is set when timer N overflow interrupt fires.
  fields:
    - name: T1_INT
      description: Timer 1 interrupt event.
      bit_offset: 0
      bit_size: 1
    - name: T2_INT
      description: Timer 2 interrupt event.
      bit_offset: 1
      bit_size: 1
    - name: T3_INT
      description: Timer 3 interrupt event.
      bit_offset: 2
      bit_size: 1
    - name: T4_INT
      description: Timer 4 interrupt event.
      bit_offset: 3
      bit_size: 1
    - name: T5_INT
      description: Timer 5 interrupt event.
      bit_offset: 4
      bit_size: 1
    - name: T6_INT
      description: Timer 6 interrupt event.
      bit_offset: 5
      bit_size: 1
    - name: T7_INT
      description: Timer 7 interrupt event.
      bit_offset: 6
      bit_size: 1
    - name: T8_INT
      description: Timer 8 interrupt event.
      bit_offset: 7
      bit_size: 1
