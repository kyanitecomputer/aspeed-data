# ── SPI1/SPI2 controller block ────────────────────────────────────────────────
# Same IP as FMC, without boot-specific WDT/soft-reset registers and
# with DMA arbitration request/grant bits in DMA_CTRL.

block/SPI:
  description: >
    ASPEED SPI Flash Controller (SPI1 at 0x7E63_0000, SPI2 at 0x7E64_0000).
    Two chip-enables per instance. Memory windows: SPI1=0x9000_0000, SPI2=0xB000_0000.
    Same IP as FMC; no boot WDT/soft-reset; DMA requires arbitration via DMA_CTRL.
  items:
    - name: CE_TYPE
      description: CE type and default write enable configuration.
      byte_offset: 0x000
      fieldset: SPI_CE_TYPE

    - name: CE_CTRL
      description: CE control — tCSH timing and 4-byte address mode selection.
      byte_offset: 0x004
      fieldset: SPI_CE_CTRL

    - name: IRQ_CTRL
      description: Interrupt control and status.
      byte_offset: 0x008
      fieldset: SPI_IRQ_CTRL

    - name: CMD_CTRL
      description: Command control — address and data byte lane enable/disable.
      byte_offset: 0x00C
      fieldset: SPI_CMD_CTRL

    - name: CE0_CTRL
      description: CE0 control — I/O mode, clock, SPI command, dummy cycles, access mode.
      byte_offset: 0x010
      fieldset: SPI_CE_N_CTRL

    - name: CE1_CTRL
      description: CE1 control (same layout as CE0_CTRL).
      byte_offset: 0x014
      fieldset: SPI_CE_N_CTRL

    - name: CE0_ADDR_RANGE
      description: >
        CE0 address decoding range. Both halves store address bits A[31:16];
        on AST2600/AST1030/AST1060 only A[27:20] are decoded (1 MB units) and
        the end bound is inclusive. Segment disabled when start == end.
      byte_offset: 0x030
      fieldset: SPI_ADDR_RANGE

    - name: CE1_ADDR_RANGE
      description: CE1 address decoding range.
      byte_offset: 0x034
      fieldset: SPI_ADDR_RANGE

    - name: DUMMY_CYCLE_DATA
      description: Data output during head of dummy cycles.
      byte_offset: 0x054
      fieldset: SPI_DUMMY_DATA

    - name: ALT_BOOT_CTRL
      description: Alternate boot control and status register.
      byte_offset: 0x064

    - name: HOST_DIRECT_CMD0
      description: Host direct access command register 0.
      byte_offset: 0x06C

    - name: HOST_DIRECT_CMD1
      description: Host direct access command register 1.
      byte_offset: 0x070

    - name: HOST_DIRECT_CMD2
      description: Host direct access command register 2.
      byte_offset: 0x074

    - name: HOST_DIRECT_CMD3
      description: Host direct access command register 3.
      byte_offset: 0x078

    - name: DMA_BUF_MODE_LEN
      description: DMA FIFO buffer mode length in 4-byte units.
      byte_offset: 0x07C
      fieldset: SPI_DMA_BUF_LEN

    - name: DMA_CTRL
      description: >
        DMA control/status. SPI requires DMA arbitration:
        write 0xAEED_0000 to bit[31] to request, wait for bit[30]=1 (granted).
        Release with 0xDEEA_0000 after DMA completes.
      byte_offset: 0x080
      fieldset: SPI_DMA_CTRL

    - name: DMA_FLASH_ADDR
      description: DMA flash-side start address.
      byte_offset: 0x084
      fieldset: SPI_DMA_FLASH_ADDR

    - name: DMA_RAM_ADDR
      description: DMA DRAM/SRAM-side start address.
      byte_offset: 0x088
      fieldset: SPI_DMA_RAM_ADDR

    - name: DMA_LEN
      description: DMA transfer length in bytes.
      byte_offset: 0x08C
      fieldset: SPI_DMA_LEN

    - name: DMA_CHECKSUM
      description: Running 32-bit checksum over flash read data.
      byte_offset: 0x090
      fieldset: SPI_DMA_CHECKSUM

    - name: CE0_READ_TIMING
      description: CE0 read timing compensation (per-HCLK-divisor input delay).
      byte_offset: 0x094
      fieldset: SPI_READ_TIMING

    - name: CE1_READ_TIMING
      description: CE1 read timing compensation.
      byte_offset: 0x098
      fieldset: SPI_READ_TIMING

    - name: CMD_FILTER_CTRL
      description: Command filter control.
      byte_offset: 0x0A0
      fieldset: SPI_CMD_FILTER_CTRL

    - name: WRITE_FILTER_CTRL
      description: Write address filter mode (6 filters for SPI vs 8 for FMC).
      byte_offset: 0x0A4
      fieldset: SPI_WRITE_FILTER_CTRL

    - name: LOCK_SRST
      description: Register lock until SRST#.
      byte_offset: 0x0A8
      fieldset: SPI_LOCK_CTRL

    - name: LOCK_WDT
      description: Register lock until WDT reset.
      byte_offset: 0x0AC
      fieldset: SPI_LOCK_CTRL

    - name: WRITE_ADDR_FILTER1
      description: Write address filter #1 range.
      byte_offset: 0x0B0
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER2
      description: Write address filter #2 range.
      byte_offset: 0x0B4
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER3
      description: Write address filter #3 range.
      byte_offset: 0x0B8
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER4
      description: Write address filter #4 range.
      byte_offset: 0x0BC
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER5
      description: Write address filter #5 range.
      byte_offset: 0x0C0
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER6
      description: Write address filter #6 range (last for SPI; FMC has 7 and 8 additionally).
      byte_offset: 0x0C4
      fieldset: SPI_WRITE_FILTER

    - name: FQCD0
      description: "FQCD entry 0 (predefined: EN4B — enter 4-byte mode)."
      byte_offset: 0x100
      fieldset: SPI_FQCD
    - name: FQCD1
      description: "FQCD entry 1 (predefined: EX4B)."
      byte_offset: 0x104
      fieldset: SPI_FQCD
    - name: FQCD2
      description: "FQCD entry 2 (predefined: EQIO)."
      byte_offset: 0x108
      fieldset: SPI_FQCD
    - name: FQCD3
      description: "FQCD entry 3 (predefined: RSTQIO)."
      byte_offset: 0x10C
      fieldset: SPI_FQCD
    - name: FQCD4
      description: FQCD entry 4 — general purpose.
      byte_offset: 0x110
      fieldset: SPI_FQCD
    - name: FQCD5
      description: FQCD entry 5 — general purpose.
      byte_offset: 0x114
      fieldset: SPI_FQCD
    - name: FQCD6
      description: FQCD entry 6 — general purpose.
      byte_offset: 0x118
      fieldset: SPI_FQCD
    - name: FQCD7
      description: FQCD entry 7 — general purpose.
      byte_offset: 0x11C
      fieldset: SPI_FQCD
    - name: FQCD8
      description: FQCD entry 8 — general purpose.
      byte_offset: 0x120
      fieldset: SPI_FQCD
    - name: FQCD9
      description: FQCD entry 9 — general purpose.
      byte_offset: 0x124
      fieldset: SPI_FQCD
    - name: FQCD10
      description: FQCD entry 10 — general purpose.
      byte_offset: 0x128
      fieldset: SPI_FQCD
    - name: FQCD11
      description: FQCD entry 11 — general purpose.
      byte_offset: 0x12C
      fieldset: SPI_FQCD
    - name: FQCD12
      description: FQCD entry 12 — general purpose.
      byte_offset: 0x130
      fieldset: SPI_FQCD
    - name: FQCD13
      description: FQCD entry 13 — general purpose.
      byte_offset: 0x134
      fieldset: SPI_FQCD
    - name: FQCD14
      description: FQCD entry 14 — general purpose.
      byte_offset: 0x138
