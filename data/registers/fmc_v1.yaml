# ASPEED Firmware SPI Memory Controller (FMC/BSPI) registers.
#
# Base: 0x7E62_0000 (AST1060).
# Memory-mapped SPI flash window: 0x0000_0000 (boot) and 0x8000_0000.
# Two chip-enables: CE0 (primary boot flash), CE1 (secondary).
#
# The FMC and SPI1/SPI2 controllers share the same register layout.
# FMC-specific additions (not present in SPI1/SPI2):
#   0x050  AUTO_SOFT_RST_CTRL  — auto 0x66/0x99 after watchdog reset
#   0x060  WDT1_CTRL           — 2s WDT, toggles CE0 3B↔4B address mode on timeout
#   0x064  WDT2_CTRL           — alternate boot WDT (CE swap on timeout)
#   0x068  WDT2_RELOAD         — WDT2 reload value
#   0x06C  WDT2_RESTART        — write 0x4755 to restart WDT2
#   0x0C8  WRITE_ADDR_FILTER7  — 7th write address filter range (FMC only)
#   0x0CC  WRITE_ADDR_FILTER8  — 8th write address filter range (FMC only)
#
# Sources:

block/FMC:
  description: >
    ASPEED Firmware SPI Memory Controller (FMC/BSPI).
    Base: 0x7E62_0000. Two chip-enables (CE0 = boot flash, CE1 = secondary).
    Flash memory mapped at 0x0000_0000 and 0x8000_0000.
  items:
    - name: CE_TYPE
      description: CE type / flash configuration. Controls per-CE flash type and default write enable.
      byte_offset: 0x000
      fieldset: FMC_CE_TYPE

    - name: CE_CTRL
      description: CE control — minimum inactive timing (tCSH) and 4-byte address mode.
      byte_offset: 0x004
      fieldset: SPI_CE_CTRL

    - name: IRQ_CTRL
      description: Interrupt control and status — DMA done, command abort, write protect.
      byte_offset: 0x008
      fieldset: SPI_IRQ_CTRL

    - name: CMD_CTRL
      description: Command control — address and data byte lane enable/disable.
      byte_offset: 0x00C
      fieldset: SPI_CMD_CTRL

    - name: CE0_CTRL
      description: CE0 control — I/O mode, clock, SPI command, dummy cycles, access mode.
      byte_offset: 0x010
      fieldset: SPI_CE_N_CTRL

    - name: CE1_CTRL
      description: CE1 control (same layout as CE0_CTRL).
      byte_offset: 0x014
      fieldset: SPI_CE_N_CTRL

    - name: CE0_ADDR_RANGE
      description: >
        CE0 address decoding range. Both halves store address bits A[31:16];
        on AST2600/AST1030/AST1060 only A[27:20] are decoded (1 MB units) and
        the end bound is inclusive. Segment disabled when start == end.
      byte_offset: 0x030
      fieldset: SPI_ADDR_RANGE

    - name: CE1_ADDR_RANGE
      description: CE1 address decoding range.
      byte_offset: 0x034
      fieldset: SPI_ADDR_RANGE

    - name: AUTO_SOFT_RST_CTRL
      description: >
        Auto soft-reset after watchdog. When enabled, hardware issues 0x66→0x99
        after WDT reset to restore SPI volatile configuration bits.
      byte_offset: 0x050
      fieldset: FMC_SOFT_RST

    - name: DUMMY_CYCLE_DATA
      description: Data output during head of dummy cycles (shared by all CEs).
      byte_offset: 0x054
      fieldset: SPI_DUMMY_DATA

    - name: WDT1_CTRL
      description: >
        WDT1 — address mode detection watchdog (2s timeout).
        On timeout, resets CPU and toggles CE0 between 3B/4B address mode.
        Stops after 2 toggles. Used to auto-detect flash address mode.
      byte_offset: 0x060
      fieldset: FMC_WDT1

    - name: WDT2_CTRL
      description: >
        WDT2 — alternate boot watchdog.
        On timeout, firmware switches boot flash source (CE0↔CE1 or primary↔alternate
        depending on ABR mode). Set BOOT_SRC_SEL to indicate current selection.
      byte_offset: 0x064
      fieldset: FMC_WDT2

    - name: WDT2_RELOAD
      description: >
        WDT2 timer reload value (unit: 0.1 s). Default 0xE0 = 22 s.
        Firmware must restart within this time by writing 0x4755 to WDT2_RESTART.
      byte_offset: 0x068
      fieldset: FMC_WDT2_RELOAD

    - name: WDT2_RESTART
      description: Write 0x4755 to reload and restart WDT2 countdown.
      byte_offset: 0x06C
      fieldset: FMC_WDT2_RESTART

    - name: DMA_BUF_MODE_LEN
      description: DMA FIFO buffer mode length in 4-byte units (0x40 = full 256 bytes).
      byte_offset: 0x07C
      fieldset: SPI_DMA_BUF_LEN

    - name: DMA_CTRL
      description: DMA control/status — direction, buffer/memory mode, checksum, enable.
      byte_offset: 0x080
      fieldset: FMC_DMA_CTRL

    - name: DMA_FLASH_ADDR
      description: DMA flash-side start address (4-byte aligned).
      byte_offset: 0x084
      fieldset: SPI_DMA_FLASH_ADDR

    - name: DMA_RAM_ADDR
      description: DMA DRAM/SRAM-side start address (4-byte aligned, memory mode only).
      byte_offset: 0x088
      fieldset: SPI_DMA_RAM_ADDR

    - name: DMA_LEN
      description: DMA transfer length in bytes (counts down during transfer).
      byte_offset: 0x08C
      fieldset: SPI_DMA_LEN

    - name: DMA_CHECKSUM
      description: Running 32-bit checksum over flash read data (reset when DMA disabled).
      byte_offset: 0x090
      fieldset: SPI_DMA_CHECKSUM

    - name: CE0_READ_TIMING
      description: CE0 SPI flash read timing compensation (per-HCLK-divisor input delay).
      byte_offset: 0x094
      fieldset: SPI_READ_TIMING

    - name: CE1_READ_TIMING
      description: CE1 SPI flash read timing compensation.
      byte_offset: 0x098
      fieldset: SPI_READ_TIMING

    - name: CMD_FILTER_CTRL
      description: Command filter control — enable per-CE and always-allow read commands.
      byte_offset: 0x0A0
      fieldset: SPI_CMD_FILTER_CTRL

    - name: WRITE_FILTER_CTRL
      description: Write address filter mode per filter entry (2 bits each, up to 8 filters).
      byte_offset: 0x0A4
      fieldset: FMC_WRITE_FILTER_CTRL

    - name: LOCK_SRST
      description: Register lock control — bits lock corresponding registers until SRST#.
      byte_offset: 0x0A8
      fieldset: SPI_LOCK_CTRL

    - name: LOCK_WDT
      description: Register lock control — bits lock corresponding registers until WDT reset.
      byte_offset: 0x0AC
      fieldset: SPI_LOCK_CTRL

    - name: WRITE_ADDR_FILTER1
      description: Write address filter #1 range (lower/upper bound in bits[27:12]).
      byte_offset: 0x0B0
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER2
      description: Write address filter #2 range.
      byte_offset: 0x0B4
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER3
      description: Write address filter #3 range.
      byte_offset: 0x0B8
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER4
      description: Write address filter #4 range.
      byte_offset: 0x0BC
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER5
      description: Write address filter #5 range.
      byte_offset: 0x0C0
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER6
      description: Write address filter #6 range.
      byte_offset: 0x0C4
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER7
      description: Write address filter #7 range (FMC only).
      byte_offset: 0x0C8
      fieldset: SPI_WRITE_FILTER

    - name: WRITE_ADDR_FILTER8
      description: Write address filter #8 range (FMC only).
      byte_offset: 0x0CC
      fieldset: SPI_WRITE_FILTER

    # 0x100-0x14C: 20 Fully Qualified Command (FQCD) table entries
    - name: FQCD0
      description: "Fully Qualified Command table entry 0 (predefined: EN4B — enter 4-byte mode)."
      byte_offset: 0x100
      fieldset: SPI_FQCD
    - name: FQCD1
      description: "FQCD entry 1 (predefined: EX4B — exit 4-byte mode)."
      byte_offset: 0x104
      fieldset: SPI_FQCD
    - name: FQCD2
      description: "FQCD entry 2 (predefined: EQIO — enter QPI mode)."
      byte_offset: 0x108
      fieldset: SPI_FQCD
    - name: FQCD3
      description: "FQCD entry 3 (predefined: RSTQIO — reset/exit QPI mode)."
      byte_offset: 0x10C
      fieldset: SPI_FQCD
    - name: FQCD4
      description: FQCD entry 4 — general purpose.
      byte_offset: 0x110
      fieldset: SPI_FQCD
    - name: FQCD5
      description: FQCD entry 5 — general purpose.
      byte_offset: 0x114
      fieldset: SPI_FQCD
    - name: FQCD6
      description: FQCD entry 6 — general purpose.
      byte_offset: 0x118
      fieldset: SPI_FQCD
    - name: FQCD7
      description: FQCD entry 7 — general purpose.
      byte_offset: 0x11C
      fieldset: SPI_FQCD
    - name: FQCD8
      description: FQCD entry 8 — general purpose.
      byte_offset: 0x120
      fieldset: SPI_FQCD
    - name: FQCD9
      description: FQCD entry 9 — general purpose.
      byte_offset: 0x124
      fieldset: SPI_FQCD
    - name: FQCD10
      description: FQCD entry 10 — general purpose.
      byte_offset: 0x128
      fieldset: SPI_FQCD
    - name: FQCD11
      description: FQCD entry 11 — general purpose.
      byte_offset: 0x12C
      fieldset: SPI_FQCD
    - name: FQCD12
      description: FQCD entry 12 — general purpose.
      byte_offset: 0x130
      fieldset: SPI_FQCD
    - name: FQCD13
      description: FQCD entry 13 — general purpose.
      byte_offset: 0x134
      fieldset: SPI_FQCD
    - name: FQCD14
      description: FQCD entry 14 — general purpose.
      byte_offset: 0x138
      fieldset: SPI_FQCD
    - name: FQCD15
      description: FQCD entry 15 — general purpose.
      byte_offset: 0x13C
      fieldset: SPI_FQCD
    - name: FQCD16
      description: FQCD entry 16 — general purpose.
      byte_offset: 0x140
      fieldset: SPI_FQCD
    - name: FQCD17
      description: FQCD entry 17 — general purpose.
      byte_offset: 0x144
      fieldset: SPI_FQCD
    - name: FQCD18
      description: FQCD entry 18 — general purpose.
      byte_offset: 0x148
      fieldset: SPI_FQCD
    - name: FQCD19
      description: "FQCD entry 19 (predefined: WREAR — write extended address register)."
      byte_offset: 0x14C
      fieldset: SPI_FQCD

    # 0x150-0x17C: 12 Address Qualified Command (AQCD) table entries
    - name: AQCD0
      description: "Address Qualified Command entry 0 (predefined: page program 0x02, read 0xXX)."
      byte_offset: 0x150
      fieldset: FMC_AQCD
    - name: AQCD1
      description: "AQCD entry 1 (predefined: sector erase 0xD8)."
      byte_offset: 0x154
      fieldset: FMC_AQCD
    - name: AQCD2
      description: AQCD entry 2 — general purpose.
      byte_offset: 0x158
      fieldset: FMC_AQCD
    - name: AQCD3
      description: AQCD entry 3 — general purpose.
      byte_offset: 0x15C
      fieldset: FMC_AQCD
