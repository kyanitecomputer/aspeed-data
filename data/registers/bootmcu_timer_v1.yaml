# AST2700 BootMCU 64-bit countdown timer.
#
# One instance at 0x14C36000 on the IO-die, visible to the BootMCU (RV32IMC).
# The timer is a 64-bit free-running counter and fires an edge-triggered
# interrupt when COUNT reaches MATCH. Writing MATCH_L/H clears CTRL.INTR_STS.
#
# Interrupt: IRQ 7 from riscv,cpu-intc (machine timer interrupt, MTIP).
#

block/TIMER:
  description: >
    AST2700 BootMCU 64-bit free-running timer with match interrupt.
    Clock source is selected by CTRL.CLK_SEL; INTR_STS is cleared by writing
    MATCH_L or MATCH_H.
    Base address: 0x14C36000 (IO-die, BootMCU view).
  items:
    - name: COUNT_L
      description: Counter low 32 bits (read-only, free-running).
      byte_offset: 0x00
      access: Read

    - name: COUNT_H
      description: Counter high 32 bits (read-only, free-running).
      byte_offset: 0x04
      access: Read

    - name: MATCH_L
      description: >
        Match compare value — low 32 bits.
        Writing this register also clears TMR_CTRL.INTR_STS.
      byte_offset: 0x08

    - name: MATCH_H
      description: >
        Match compare value — high 32 bits.
        Writing this register also clears TMR_CTRL.INTR_STS.
      byte_offset: 0x0C

    - name: CTRL
      description: >
        Timer control and interrupt status register.
        Bits written 1 in this register set the corresponding function.
        Use CTRL_CLR to clear bits.
      byte_offset: 0x10
      fieldset: CTRL

    - name: CTRL_CLR
      description: >
        Write-1-clear mirror of CTRL.
        Write 1 to a bit to clear the corresponding CTRL bit.
      byte_offset: 0x14
      fieldset: CTRL

    - name: WRITE_PROTECT
      description: Counter write protection register (RVTMC1C).
      byte_offset: 0x1C
      fieldset: WRITE_PROTECT

# ── Fieldsets ──────────────────────────────────────────────────────────────────

fieldset/CTRL:
  description: Timer control register (used for both CTRL and CTRL_CLR).
  fields:
    - name: INTR_EN
      description: >
        Timer interrupt enable.
        0 = disable; 1 = enable counter/reload/interrupt actions.
      bit_offset: 0
      bit_size: 1

    - name: CLK_SEL
      description: >
        Counter clock selection.
        0 = APB PCLK; 1 = 1 MHz clock.
      bit_offset: 1
      bit_size: 1

    - name: COUNT_CLR
      description: >
        Counter clear.
        Write 1 to clear the 64-bit counter to 0.
      bit_offset: 3
      bit_size: 1

    - name: INTR_STS
      description: >
        Interrupt status.
        Set when COUNT reaches MATCH.
        Cleared by writing MATCH_L or MATCH_H.
      bit_offset: 16
      bit_size: 1

fieldset/WRITE_PROTECT:
  description: BootMCU timer write protection register.
  fields:
    - name: MATCH_L_WP
      bit_offset: 2
      bit_size: 1
    - name: MATCH_H_WP
      bit_offset: 3
      bit_size: 1
    - name: CTRL_WP
      bit_offset: 4
      bit_size: 1
    - name: CTRL_CLR_WP
      bit_offset: 5
      bit_size: 1
