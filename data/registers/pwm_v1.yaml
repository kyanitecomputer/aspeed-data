  items:
    # ── Channel 0 ────────────────────────────────────────────────────────────
    - name: CH0_PWM_CTRL
      description: PWM Channel 0 Control Register (offset 0x00).
      byte_offset: 0x00
      fieldset: PWM_CTRL

    - name: CH0_PWM_DUTY
      description: PWM Channel 0 Duty Cycle Register (offset 0x04).
      byte_offset: 0x04
      fieldset: PWM_DUTY

    - name: CH0_TACH_CTRL
      description: Tachometer Channel 0 Control Register (offset 0x08).
      byte_offset: 0x08
      fieldset: TACH_CTRL

    - name: CH0_TACH_STS
      description: Tachometer Channel 0 Status Register (offset 0x0C).
      byte_offset: 0x0C
      fieldset: TACH_STS

