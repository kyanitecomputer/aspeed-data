# ── Fieldsets ─────────────────────────────────────────────────────────────────

fieldset/PWM_CTRL:
  description: >
    PWM channel control register.
    Controls PWM output enable, clock prescaler, polarity, and WDT-safe mode.
    Clock: input_clk / ((DIV_L + 1) << DIV_H)
  fields:
    - name: CLK_DIV_L
      description: >
        Low-order clock divider [7:0].
        Effective clock = input_clk / ((DIV_L + 1) << DIV_H).
      bit_offset: 0
      bit_size: 8
    - name: CLK_DIV_H
      description: >
        High-order clock divider (shift amount) [11:8].
        Effective clock = input_clk / ((DIV_L + 1) << DIV_H).
        Range 0–15 giving divisors of 1–32768 × (DIV_L+1).
      bit_offset: 8
      bit_size: 4
    - name: PIN_EN
      description: >
        PWM output pin enable [12].
        0 = output held at inactive level; PWM counter does not drive the pin.
        1 = PWM signal drives the output pin.
        CLK_EN must also be set for the duty cycle to be non-zero.
      bit_offset: 12
      bit_size: 1
    - name: OPEN_DRAIN_EN
      description: Open-drain output mode [13]. 0 = push-pull, 1 = open-drain.
      bit_offset: 13
      bit_size: 1
    - name: INVERSE
      description: >
        Output polarity inversion [14].
        0 = active high. 1 = active low (output is inverted immediately).
        Toggling this while PWM is running may generate a glitch.
      bit_offset: 14
      bit_size: 1
    - name: LEVEL_OUTPUT
      description: >
        Force output to inactive level [15].
        When set, the PWM output is forced to inactive regardless of CLK_EN.
      bit_offset: 15
      bit_size: 1
    - name: CLK_EN
      description: >
        PWM clock enable [16].
        0 = duty counter held in reset, output at inactive level.
        1 = duty counter runs; duty cycle determined by PWM_DUTY.
        Use PIN_EN to gate the output without resetting the counter.
      bit_offset: 16
      bit_size: 1
    - name: DUTY_SYNC_DIS
      description: >
        Duty cycle synchronisation disable [17].
        0 = new duty values take effect at the start of the next period (glitch-free).
        1 = new duty values take effect immediately.
      bit_offset: 17
      bit_size: 1
    - name: DUTY_LOAD_WDT_EN
      description: >
        Load duty cycle from WDT-safe value on watchdog event [18].
        When set, a WDT reset causes the PWM to switch to the duty point
        programmed in PWM_DUTY.POINT_WDT.
      bit_offset: 18
      bit_size: 1
    - name: LOAD_SEL_RISING_WDT
      description: >
        WDT duty select: use rising point as WDT-safe duty [19].
        0 = use FALLING_POINT as WDT duty. 1 = use RISING_POINT as WDT duty.
      bit_offset: 19
      bit_size: 1

fieldset/PWM_DUTY:
  description: >
    PWM channel duty cycle register.
    Period = (DUTY_PERIOD + 1) × Q, where Q = (DIV_L+1) << DIV_H / input_clk.
    Active time = (FALLING_POINT - RISING_POINT) × Q.
    RISING_POINT = 0 and FALLING_POINT = DUTY_PERIOD+1 → 100% duty cycle.
    FALLING_POINT = 0 (and CLK_EN=1) → 100% duty cycle (rising=falling=0).
  fields:
    - name: RISING_POINT
      description: >
        Duty cycle rising edge point [7:0].
        The PWM output goes active at this count within the period.
        Typically 0 (output active from start of period).
      bit_offset: 0
      bit_size: 8
    - name: FALLING_POINT
      description: >
        Duty cycle falling edge point [15:8].
        The PWM output goes inactive at this count.
        duty_cycle = (FALLING_POINT - RISING_POINT) / (DUTY_PERIOD + 1).
        Set equal to RISING_POINT for 100% duty cycle.
      bit_offset: 8
      bit_size: 8
    - name: POINT_WDT
      description: >
        WDT-safe duty cycle point [23:16].
        Used as the falling point when DUTY_LOAD_WDT_EN fires.
        Allows a safe fan speed fallback on watchdog reset.
      bit_offset: 16
      bit_size: 8
    - name: DUTY_PERIOD
      description: >
        PWM period length [31:24].
        Period = (DUTY_PERIOD + 1) × Q.
        Maximum value (255) is recommended for fine-grained duty control.
      bit_offset: 24
      bit_size: 8

fieldset/TACH_CTRL:
  description: >
    Tachometer channel control register.
    Measures fan speed by timing edges on the TACH input pin.
    fan_rpm = (clk_hz × 60) / (tach_value × pulses_per_rev × 4^CLK_DIV_T)
  fields:
    - name: THRESHOLD
      description: >
        Fan stopped / timeout threshold [19:0].
        If the tach counter exceeds this value between edges, the fan is
        considered stopped and the IRQ fires (if IER=1).
        Set to the counter value corresponding to ~0 RPM.
      bit_offset: 0
      bit_size: 20
    - name: CLK_DIV_T
      description: >
        Tachometer input clock divisor [23:20].
        Actual divisor = 4^CLK_DIV_T.
        Values: 0→1, 1→4, 2→16, 3→64, …, 15→4^15.
        Use larger values for slow fans to avoid counter overflow.
      bit_offset: 20
      bit_size: 4
    - name: IO_EDGE
      description: >
        Edge detection mode [25:24].
        0 = falling-to-falling (F2F).
        1 = rising-to-rising (R2R).
        2 = both edges (period = half-cycle).
      bit_offset: 24
      bit_size: 2
    - name: DEBOUNCE
      description: >
        Input debounce filter [27:26].
        0 = 3 clock cycles. 1 = 2 cycles. 2 = 1 cycle. 3 = no debounce.
      bit_offset: 26
      bit_size: 2
    - name: ENABLE
      description: Tachometer channel enable [28]. 1 = measuring; 0 = disabled.
      bit_offset: 28
      bit_size: 1
    - name: LOOPBACK
      description: >
        PWM-to-tach loopback test [29].
        When set, this tach channel monitors the corresponding PWM output.
        Used for self-test; disconnect external fan input first.
      bit_offset: 29
      bit_size: 1
    - name: INVERS_LIMIT
      description: >
        Interrupt on fan too-fast (below threshold) [30].
        0 = interrupt when tach_value > THRESHOLD (fan too slow / stopped).
        1 = interrupt when tach_value < THRESHOLD (fan too fast).
      bit_offset: 30
      bit_size: 1
    - name: IER
      description: Tachometer interrupt enable [31]. 1 = interrupt on threshold event.
      bit_offset: 31
      bit_size: 1

fieldset/TACH_STS:
  description: >
    Tachometer channel status register (read-only / RW1C on bit 31).
    Contains the captured tach value and status flags.
  fields:
    - name: VALUE
      description: >
        Captured tachometer count [19:0].
        Number of input clock cycles between successive TACH edges
        (divided by 4^CLK_DIV_T).
        Convert to RPM: fan_rpm = (clk_hz × 60) / (VALUE × PPR × 4^CLK_DIV_T)
        where PPR = pulses per revolution of the fan (typically 2).
      bit_offset: 0
      bit_size: 20
    - name: FULL_MEASUREMENT
      description: >
        Full measurement complete [20]. Set after the first complete edge-to-edge
        measurement. Clear until the first complete measurement since enable.
      bit_offset: 20
      bit_size: 1
    - name: VALUE_UPDATE
      description: >
        Tach value updated flag [21]. Set when a new measurement completes.
        Poll or use interrupt to detect new results.
      bit_offset: 21
      bit_size: 1
    - name: RAW_INPUT
      description: Raw (unlatched) tachometer pin state [22]. Read-only.
      bit_offset: 22
      bit_size: 1
    - name: DEB_INPUT
      description: Debounced tachometer input state [23]. Read-only.
      bit_offset: 23
      bit_size: 1
    - name: PWM_OEN
      description: Current state of the paired PWM output-enable [24]. Read-only.
      bit_offset: 24
      bit_size: 1
    - name: PWM_OUT
      description: Current state of the paired PWM output pin [25]. Read-only.
      bit_offset: 25
      bit_size: 1
    - name: ISR
      description: >
        Tachometer interrupt status / clear [31]. RW1C.
        Set by hardware when the threshold event fires (IER must be 1).
        Write 1 to clear.
      bit_offset: 31
      bit_size: 1
