# ASPEED G6 PWM and Fan Tachometer Controller registers.
#
# This IP is the "G6" (generation 6) redesign found in the AST2600.
# It is *not* compatible with the older aspeed-pwm-tacho IP (AST2400/2500).
#
# Base address: 0x7E61_0000 (AST2600, CM3 view).
#
# PWM engine: 16 independent channels (CH0–15).
# Tachometer:  16 independent input capture channels (TACH0–15).
# Both PWM and TACH channels can be operated independently.
#
# Register layout per channel (stride 0x10):
#   channel × 0x10 + 0x00  PWM_CTRL       — clock divider, enable, polarity
#   channel × 0x10 + 0x04  PWM_DUTY       — period, falling point, rising point
#   channel × 0x10 + 0x08  TACH_CTRL      — tach enable, IRQ enable, debounce, threshold
#   channel × 0x10 + 0x0C  TACH_STS       — tach IRQ status, captured value
#
# PWM period formula:
#   Q     = (DIV_L + 1) << DIV_H / input_clk
#   period = (DUTY_PERIOD + 1) × Q
#   duty   = (FALLING_POINT − RISING_POINT) × Q
#
# Tachometer resolution:
#   fan_rpm = (input_clk × 60) / (tach_value × pulse_per_revolution × DIV_T)
#   where DIV_T = 4^(CLK_DIV_T field value).
#
# Sources:
#   drivers/hwmon/aspeed-g6-pwm-tach.c  (Linux 6.12.3)
#   Documentation/devicetree/bindings/hwmon/aspeed,g6-pwm-tach.yaml
#   ast2600.pdf  Chapter — PWM/Tachometer Controller (G6)

block/PWM_TACH:
  description: >
    ASPEED G6 PWM and Fan Tachometer controller.
