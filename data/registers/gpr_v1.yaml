# AST2700 CM4F General-Purpose Registers (GPR) bank.
#
# 32 × 32-bit GPRs at CM4F addresses 0x5000_0000–0x5000_007C,
# plus an AHB page-select register (S_PAGE) at 0x5000_0080.
#
# These registers are unique to the AST2700 CM4F private bus.
# No equivalent on AST2600.
#
# The GPR bank allows the CM4F to communicate status/config to the CA35
# without using IPC. The S_PAGE register selects which 512 KB AHB page is
# mapped into the CM4F 32-bit address space for DMA access.
#
# Sources:
#   ast2700_ssp.pdf v0.1h  Section 3.4 – GPR registers
#   ast2700_tsp.pdf v0.1f  Section 3.4 – same layout

block/GPR:
  description: >
    AST2700 CM4F General-Purpose Register bank.
    Base: 0x5000_0000 (CM4F private bus).
    32 GPRs at 0x00–0x7C plus S_PAGE at 0x80.
  items:
    - name: GPR0
      description: General-Purpose Register 0.
      byte_offset: 0x00
      fieldset: GPR_REG
    - name: GPR1
      description: General-Purpose Register 1.
      byte_offset: 0x04
      fieldset: GPR_REG
    - name: GPR2
      description: General-Purpose Register 2.
      byte_offset: 0x08
      fieldset: GPR_REG
    - name: GPR3
      description: General-Purpose Register 3.
      byte_offset: 0x0C
      fieldset: GPR_REG
    - name: GPR4
      description: General-Purpose Register 4.
      byte_offset: 0x10
      fieldset: GPR_REG
    - name: GPR5
      description: General-Purpose Register 5.
      byte_offset: 0x14
      fieldset: GPR_REG
    - name: GPR6
      description: General-Purpose Register 6.
      byte_offset: 0x18
      fieldset: GPR_REG
    - name: GPR7
      description: General-Purpose Register 7.
      byte_offset: 0x1C
      fieldset: GPR_REG
    - name: GPR8
      description: General-Purpose Register 8.
      byte_offset: 0x20
      fieldset: GPR_REG
    - name: GPR9
      description: General-Purpose Register 9.
      byte_offset: 0x24
      fieldset: GPR_REG
    - name: GPR10
      description: General-Purpose Register 10.
      byte_offset: 0x28
      fieldset: GPR_REG
    - name: GPR11
      description: General-Purpose Register 11.
      byte_offset: 0x2C
      fieldset: GPR_REG
