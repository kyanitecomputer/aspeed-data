    - name: S_PAGE
      description: >
        AHB Page Select Register (0x80).
        Selects which 512 KB page of the AHB address space is accessible
        for DMA operations by the CM4F.
      byte_offset: 0x80
      fieldset: S_PAGE_REG

# ── Fieldsets ──────────────────────────────────────────────────────────────────

fieldset/GPR_REG:
  description: General-purpose 32-bit read/write register.
  fields:
    - name: VALUE
      description: Register value (32-bit, software-defined meaning).
      bit_offset: 0
      bit_size: 32

fieldset/S_PAGE_REG:
  description: AHB page select register. Selects 512 KB AHB page for CM4F DMA.
  fields:
    - name: PAGE
      description: AHB page index (bits [31:0]; effective bits hardware-defined).
      bit_offset: 0
      bit_size: 32
