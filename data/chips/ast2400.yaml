# ASPEED AST2400 ColdFire coprocessor chip definition.
#
# The AST2400 is the predecessor to AST2500.  Its embedded ColdFire V1
# coprocessor has a 24-bit address space with 5 segments of 2 MB each
# (compared to 9 × 64 KB segments on AST2500).
#
# Key differences from AST2500:
#   - 5 segments × 2 MB (vs. 9 segments × 64 KB)
#   - Segment base register: ENDIAN_SWAP at bit[31] (vs. bit[0] on AST2500)
#   - No instruction cache control register (CACHE_CTRL absent)
#   - Default segment map uses 2 MB granularity
#
# Default segment mapping (after ROM boot, 2 MB windows):
#   SEG0: CF 0x000000–0x1FFFFF → BMC 0x00000000 (boot ROM)
#   SEG1: CF 0x200000–0x3FFFFF → BMC 0x1E600000 (SCU, VIC, HACE, ...)
#   SEG2: CF 0x400000–0x5FFFFF → BMC 0x1E800000 (DRAM controller, ...)
#   SEG3: CF 0x600000–0x7FFFFF → BMC 0x1E700000 (UART, GPIO, WDT, Timer)
#   SEG4: CF 0x800000–0x9FFFFF → DRAM
#
# Address translation for peripheral addresses below:
#   CF addr = 0x200000 + (BMC_addr - 0x1E600000)  for BMC 0x1E6xxxxx (SEG1)
#   CF addr = 0x600000 + (BMC_addr - 0x1E700000)  for BMC 0x1E7xxxxx (SEG3)
#
# Sources:
#   AST2400 datasheet v1.4 (ast2400v14): chapters 5 (SCU), 9 (CVIC), 8 (UART),
#     43 (Timer), 46 (WDT), 44 (GPIO)
#   OpenBMC: meta-aspeed AST2400 machine configuration

name:    AST2400
family:  ast24xx
core:    coldfire-v1
target:  m68k-none-elf
arch:    coldfire
num_irqs: 32

# ── Peripheral instances ──────────────────────────────────────────────────────
#
# Addresses are ColdFire virtual addresses using the default segment map.

peripherals:
  # ColdFire coprocessor control — uses coproc_v2 (5 segments, bit[31] endian).
  # BMC: 0x1E6E2100 → CF: 0x2E2100  (SEG1 offset = BMC - 0x1E600000 = 0xE2100)
  - name:    COPROC
    block:   coproc_v2::COPROC
    address: 0x2E2100
    description: "ColdFire coprocessor control (SCU100–SCU114): 5 segments × 2 MB"

  # ColdFire VIC — same register layout as AST2500 (cvic_v1).
  # BMC: 0x1E6C2000 → CF: 0x2C2000
  - name:    CVIC
    block:   cvic_v1::CVIC
    address: 0x2C2000
    description: "ColdFire VIC: 32 IRQ sources (same IP as AST2500)"

  # UART1
  # BMC: 0x1E783000 → CF: 0x683000  (SEG3 offset = BMC - 0x1E700000 = 0x83000)
  - name:    UART1
    block:   uart_v1::UART
    address: 0x683000
    description: "UART1 (16550, 4-byte stride)"

  # UART2
  # BMC: 0x1E78D000 → CF: 0x68D000
  - name:    UART2
    block:   uart_v1::UART
    address: 0x68D000
    description: "UART2 (16550, 4-byte stride)"

  # UART3
  # BMC: 0x1E78E000 → CF: 0x68E000
  - name:    UART3
    block:   uart_v1::UART
    address: 0x68E000
    description: "UART3 (16550, 4-byte stride)"

  # UART4
  # BMC: 0x1E78F000 → CF: 0x68F000
  - name:    UART4
    block:   uart_v1::UART
    address: 0x68F000
    description: "UART4 (16550, 4-byte stride)"

  # UART5
  # BMC: 0x1E784000 → CF: 0x684000
  - name:    UART5
    block:   uart_v1::UART
    address: 0x684000
    description: "UART5 (16550, 4-byte stride)"

  # Hardware timer — same IP as AST2500/AST2600.
  # BMC: 0x1E782000 → CF: 0x682000
  - name:    TIMER
    block:   timer_v1::TIMER
    address: 0x682000
    description: "Hardware timer (8 × 32-bit countdown)"

  # Watchdog timer 0.
  # BMC: 0x1E785000 → CF: 0x685000
  - name:    WDT
    block:   wdt_v1::WDT
    address: 0x685000
    description: "Watchdog timer 0 (same IP as AST2500)"

  # GPIO controller.
  # BMC: 0x1E780000 → CF: 0x680000
  - name:    GPIO
    block:   gpio_v1::GPIO
    address: 0x680000
    description: "GPIO controller (208 pins)"

# ── Interrupt table (CVIC, 32 sources) ───────────────────────────────────────
#
# AST2400 CVIC interrupt assignments mirror AST2500; extend as verified.

interrupts:
  - { name: SW,       number: 0  }  # Software-generated interrupt
  - { name: UART1,    number: 1  }  # UART1
  - { name: UART2,    number: 2  }  # UART2
  - { name: UART3,    number: 3  }  # UART3
  - { name: UART4,    number: 4  }  # UART4
  - { name: UART5,    number: 5  }  # UART5
  - { name: WDT,      number: 6  }  # Watchdog timer
  - { name: TIMER1,   number: 7  }  # Hardware timer 1
  - { name: TIMER2,   number: 8  }  # Hardware timer 2
  - { name: TIMER3,   number: 9  }  # Hardware timer 3
  - { name: TIMER4,   number: 10 }  # Hardware timer 4
  - { name: TIMER5,   number: 11 }  # Hardware timer 5
  - { name: GPIO,     number: 12 }  # GPIO
  - { name: I2C,      number: 13 }  # I2C
  - { name: ARM,      number: 14 }  # ARM→ColdFire IPI
  - { name: DMA,      number: 15 }  # DMA
