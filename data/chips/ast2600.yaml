  # IRQ 138–148: IPMI KCS, BT, VUART
  - { name: KCS1,           number: 138 }  # KCS (Keyboard Controller Style) IBF
  - { name: KCS2,           number: 139 }
  - { name: KCS3,           number: 140 }
