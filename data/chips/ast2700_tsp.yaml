# ASPEED AST2700 Tertiary Service Processor (TSP) chip definition.
#
# The TSP is a second ARM Cortex-M4F coprocessor in the AST2700 SoC.
# It is symmetric with the SSP (same register layout) but uses a different
# SCU0 offset: SCU0+0x160 = 0x72C0_2160.

name:               AST2700_TSP
family:             ast27xx
core:               cortex-m4f
target:             thumbv7em-none-eabihf
nvic_priority_bits: 3
num_irqs:           240

# ── Peripheral instances ──────────────────────────────────────────────────────

peripherals:
  # TSP coprocessor control (SCU0 + 0x160)
  - name:    SSP
    block:   ssp_v2::SSP
    address: 0x72c02160

  # GPR bank (CM4F private bus — same base as SSP)
  - name:    GPR
    block:   gpr_v1::GPR
    address: 0x50000000

  # ── Core service peripherals ───────────────────────────────────────────────

  - name:    TIMER0
    block:   timer_v1::TIMER
    address: 0x72c10000
    description: "CPU-die timer block"

  - name:    UART4
    block:   uart_v1::UART
    address: 0x72c1a000
    description: "CPU-die UART4"

  - name:    UART7
    block:   uart_v1::UART
    address: 0x74c33600
    description: "IO-die UART7"

  - name:    GPIO0
    block:   gpio_v1::GPIO
    address: 0x72c11000
    description: "CPU-die GPIO bank"

  - name:    GPIO1
    block:   gpio_v1::GPIO
    address: 0x74c0b000
    description: "IO-die GPIO bank"

  - name:    WDT0
    block:   wdt_ast2700_v1::WDT
    address: 0x74c37000
    description: "IO-die watchdog timer 0"

  - name:    ADC0
    block:   adc_v1::ADC
    address: 0x74c00000
    description: "IO-die ADC bank 0"

  - name:    ADC1
    block:   adc_v1::ADC
    address: 0x74c00100
    description: "IO-die ADC bank 1"

  - name:    IPC0
    block:   ipc0_v1::IPC0
    address: 0x72c1c000
    description: "IPC0 data-channel bus"

  # ── Interrupt controllers ─────────────────────────────────────────────────

  - name:    INTCG
    block:   intcg_ast2700_v1::INTCG
    address: 0x72100000
    description: "CPU-die interrupt routing controller (INTCG)"

  - name:    INTC1G
    block:   intcg_ast2700_v1::INTC1G
    address: 0x74c18000
    description: "IO-die interrupt routing controller (INTC1G)"

  - name:    INTC0_11
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x72102b00
    description: "CPU-die L1 aggregator (NVIC 160-165, parent of INTC1_x)"

  - name:    INTC1_0
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c18180
    description: "IO-die L2 aggregator 0"

  - name:    INTC1_1
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c18190
    description: "IO-die L2 aggregator 1"

  - name:    INTC1_2
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c181a0
    description: "IO-die L2 aggregator 2"

  - name:    INTC1_3
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c181b0
    description: "IO-die L2 aggregator 3"

  - name:    INTC1_4
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c181c0
    description: "IO-die L2 aggregator 4"

  - name:    INTC1_5
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c181d0
    description: "IO-die L2 aggregator 5"

# ── Interrupt table ───────────────────────────────────────────────────────────
# Same NVIC topology as AST2700 SSP. TSP IRQ routing via same cascaded INTC.

interrupts:
  - { name: TIMER1,         number: 16  }
  - { name: TIMER2,         number: 17  }
  - { name: TIMER3,         number: 18  }
  - { name: TIMER4,         number: 19  }
  - { name: TIMER5,         number: 20  }
  - { name: TIMER6,         number: 21  }
  - { name: TIMER7,         number: 22  }
  - { name: TIMER8,         number: 23  }
  - { name: WDT,            number: 24  }
  - { name: GPIO,           number: 40  }
  - { name: UART1,          number: 47  }
  - { name: UART2,          number: 48  }
  - { name: UART3,          number: 49  }
  - { name: UART4,          number: 50  }
  - { name: UART5,          number: 51  }
  - { name: UART6,          number: 52  }
  - { name: UART7,          number: 53  }
  - { name: UART8,          number: 54  }
  - { name: INTC0,          number: 160 }
  - { name: INTC1,          number: 161 }
  - { name: INTC2,          number: 162 }
  - { name: INTC3,          number: 163 }
  - { name: INTC4,          number: 164 }
  - { name: INTC5,          number: 165 }
  # Legacy IPC (BMC↔TSP 7 channels)
  - { name: IPC_TSP0,       number: 151 }
  - { name: IPC_TSP1,       number: 152 }
  - { name: IPC_TSP2,       number: 153 }
  - { name: IPC_TSP3,       number: 154 }
  - { name: IPC_TSP4,       number: 155 }
  - { name: IPC_TSP5,       number: 156 }
  - { name: IPC_TSP6,       number: 157 }
