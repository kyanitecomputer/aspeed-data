# ASPEED AST1060 chip definition.
#
# The AST1060 is a standalone ARM Cortex-M4F SoC (not a BMC co-processor).
# It communicates with a host system via SPI passthrough and I2C/I3C buses.
# Peripheral addresses are in the CPU's native view (0x7E6xxxxx / 0x7E7xxxxx).
#
# Memory map:
#   0x0000_0000 – 0x000B_FFFF : SRAM (768 KB, boot and runtime)
#   0x8000_0000 – 0x8FFF_FFFF : FMC flash memory-mapped window (256 MB)
#   0x9000_0000 – 0x9FFF_FFFF : SPI1 flash memory-mapped window
#   0xB000_0000 – 0xBFFF_FFFF : SPI2 flash memory-mapped window
#   0x7E6x_xxxx / 0x7E7x_xxxx : Peripheral registers
#

name:               AST1060
family:             ast10xx
core:               cortex-m4f
target:             thumbv7em-none-eabihf
nvic_priority_bits: 4
num_irqs:           240

# ── Peripheral instances ──────────────────────────────────────────────────────

peripherals:
  # ── System Control Unit (SCU / Clock) ────────────────────────────────────
  - name:    SCU
    block:   clock_ast1060_v1::SCU
    address: 0x7e6e2000

  # ── Flash controllers ─────────────────────────────────────────────────────
  - name:    FMC
    description: Firmware Memory Controller (boot SPI), CE0-CE1
    block:   fmc_v1::FMC
    address: 0x7e620000

  - name:    SPI1
    description: SPI Flash Controller 1, CE0-CE1, memory window 0x9000_0000
    block:   fmc_v1::SPI
    address: 0x7e630000

  - name:    SPI2
    description: SPI Flash Controller 2, CE0-CE1, memory window 0xB000_0000
    block:   fmc_v1::SPI
    address: 0x7e640000

  # ── Hash and Crypto Engine ────────────────────────────────────────────────
  - name:    HACE
    description: Hash and Crypto Engine (AES/DES/RC4 + SHA/MD5/HMAC)
    block:   hace_v1::HACE
    address: 0x7e6d0000

  # ── ADC ───────────────────────────────────────────────────────────────────
  # 8-channel 10-bit ADC. Channels CH0–7.
  # Base: 0x7E6E_9000.
  - name:    ADC
    description: 10-bit ADC controller, 8 channels (CH0–7)
    block:   adc_v1::ADC
    address: 0x7e6e9000

  # ── Hardware TRNG (True Random Number Generator) ─────────────────────────
  # Embedded in SCU address space at offset 0x530 from SCU base.
  - name:    TRNG
    description: Hardware True Random Number Generator
    block:   trng_v1::TRNG
    address: 0x7e6e2530

  # ── Secure Boot Controller / OTP ─────────────────────────────────────────
  - name:    SECURE
    description: Secure Boot Controller and OTP engine
    block:   secure_v1::SECURE
    address: 0x7e6f2000

  # ── GPIO ──────────────────────────────────────────────────────────────────
  # AST1060 GPIO uses the same register layout as AST2600 gpio_v1 for ports
  # A-U (21 ports, 149 usable pins). Ports T and U are input-only.
  - name:    GPIO
    description: GPIO controller (ports A-U, 149 usable pins)
    block:   gpio_v1::GPIO
    address: 0x7e780000

  # ── Serial GPIO Master (embedded in GPIO block at +0x500) ─────────────────
  - name:    SGPIO
    description: Serial GPIO Master (SGPIOM), 4 groups up to 128 bits
    block:   sgpio_v1::SGPIO
    address: 0x7e780500

  # ── Timer ─────────────────────────────────────────────────────────────────
  - name:    TIMER
    description: 8-channel 32-bit countdown timer
    block:   timer_v1::TIMER
    address: 0x7e782000

  # ── UART ─────────────────────────────────────────────────────────────────
  - name:    UART5
    description: UART5 (16550-compatible, AST1060 debug console)
    block:   uart_v1::UART
    address: 0x7e784000

  # ── Watchdog timers (4 instances, stride 0x80) ────────────────────────────
  - name:    WDT1
    block:   wdt_v1::WDT
    address: 0x7e785000

  - name:    WDT2
    block:   wdt_v1::WDT
    address: 0x7e785080

  - name:    WDT3
    block:   wdt_v1::WDT
    address: 0x7e785100

  - name:    WDT4
    block:   wdt_v1::WDT
    address: 0x7e785180

  # ── UART DMA ─────────────────────────────────────────────────────────────
  - name:    UART_DMA
    description: UART DMA controller (UART1, UART2, UART5)
    block:   uartdma_v1::UARTDMA
    address: 0x7e79e000

  # ── SPI Passthrough Filter / QSPI Monitor (4 instances, stride 0x1000) ───
  - name:    SPIPF1
    block:   spipf_v1::SPIPF
    address: 0x7e791000

  - name:    SPIPF2
    block:   spipf_v1::SPIPF
    address: 0x7e792000

  - name:    SPIPF3
    block:   spipf_v1::SPIPF
    address: 0x7e793000

  - name:    SPIPF4
    block:   spipf_v1::SPIPF
    address: 0x7e794000

  # ── I3C Global ───────────────────────────────────────────────────────────
  - name:    I3C_GLOBAL
    description: I3C global wrapper registers (6 channels × 4 regs at 0x010-0x06C)
    block:   i3cglobal_v1::I3CGLOBAL
    address: 0x7e7a0000

  # ── I3C instances (4 channels, stride 0x1000) ────────────────────────────
  - name:    I3C0
    block:   i3c_v1::I3C
    address: 0x7e7a2000

  - name:    I3C1
    block:   i3c_v1::I3C
    address: 0x7e7a3000

  - name:    I3C2
    block:   i3c_v1::I3C
    address: 0x7e7a4000

  - name:    I3C3
    block:   i3c_v1::I3C
    address: 0x7e7a5000

  # ── SMBus/I2C PFR Filter ──────────────────────────────────────────────────────
  # Global interrupt control at 0x7E7B_2000. Per-instance stride 0x100 from +0x200.
  - name:    SMBUS_FILTER_GLOBAL
    description: SMBus/I2C PFR Filter global interrupt enable/status
    block:   i2cfilter_v1::SMBUS_FILTER_GLOBAL
    address: 0x7e7b2000

  - name:    SMBUS_FILTER0
    description: SMBus/I2C PFR Filter instance 0
    block:   i2cfilter_v1::SMBUS_FILTER
    address: 0x7e7b2200

  - name:    SMBUS_FILTER1
    description: SMBus/I2C PFR Filter instance 1
    block:   i2cfilter_v1::SMBUS_FILTER
    address: 0x7e7b2300

  - name:    SMBUS_FILTER2
    description: SMBus/I2C PFR Filter instance 2
    block:   i2cfilter_v1::SMBUS_FILTER
    address: 0x7e7b2400

  - name:    SMBUS_FILTER3
    description: SMBus/I2C PFR Filter instance 3
    block:   i2cfilter_v1::SMBUS_FILTER
    address: 0x7e7b2500

  # ── I2C Global ────────────────────────────────────────────────────────────
  - name:    I2C_GLOBAL
    description: I2C/SMBus global interrupt status and clock divider
    block:   i2cglobal_v1::I2CGLOBAL
    address: 0x7e7b0000

  # ── I2C instances (14 channels, stride 0x80, starting at base+0x80) ──────
  - name:    I2C0
    block:   i2c_v1::I2C
    address: 0x7e7b0080

  - name:    I2C1
    block:   i2c_v1::I2C
    address: 0x7e7b0100

  - name:    I2C2
    block:   i2c_v1::I2C
    address: 0x7e7b0180

  - name:    I2C3
    block:   i2c_v1::I2C
    address: 0x7e7b0200

  - name:    I2C4
    block:   i2c_v1::I2C
    address: 0x7e7b0280

  - name:    I2C5
    block:   i2c_v1::I2C
    address: 0x7e7b0300

  - name:    I2C6
    block:   i2c_v1::I2C
    address: 0x7e7b0380

  - name:    I2C7
    block:   i2c_v1::I2C
    address: 0x7e7b0400

  - name:    I2C8
    block:   i2c_v1::I2C
    address: 0x7e7b0480

  - name:    I2C9
    block:   i2c_v1::I2C
    address: 0x7e7b0500

  - name:    I2C10
    block:   i2c_v1::I2C
    address: 0x7e7b0580

  - name:    I2C11
    block:   i2c_v1::I2C
    address: 0x7e7b0600

  - name:    I2C12
    block:   i2c_v1::I2C
    address: 0x7e7b0680

  - name:    I2C13
    block:   i2c_v1::I2C
    address: 0x7e7b0700

  # ── I2C pool buffers (14 channels, stride 0x20, starting at base+0xC00) ──
  - name:    I2C0_BUF
    description: I2C0 pool buffer SRAM (32 bytes)
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0c00

  - name:    I2C1_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0c20

  - name:    I2C2_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0c40

  - name:    I2C3_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0c60

  - name:    I2C4_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0c80

  - name:    I2C5_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0ca0

  - name:    I2C6_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0cc0

  - name:    I2C7_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0ce0

  - name:    I2C8_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0d00

  - name:    I2C9_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0d20

  - name:    I2C10_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0d40

  - name:    I2C11_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0d60

  - name:    I2C12_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0d80

  - name:    I2C13_BUF
    block:   i2cbuff_v1::I2CBUFF
    address: 0x7e7b0da0

# ── Interrupt table ───────────────────────────────────────────────────────────
#
# Interrupt names and numbers mirror the local AST1060 PAC reference.

interrupts:
  - { name: HACE,            number: 4   }
  - { name: UART5,           number: 8   }
  - { name: GPIO,            number: 11  }
  - { name: SCU,             number: 12  }

  # IRQ 16–23: Timer 1–8
  - { name: TIMER1,          number: 16  }
  - { name: TIMER2,          number: 17  }
  - { name: TIMER3,          number: 18  }
  - { name: TIMER4,          number: 19  }
  - { name: TIMER5,          number: 20  }
  - { name: TIMER6,          number: 21  }
  - { name: TIMER7,          number: 22  }
  - { name: TIMER8,          number: 23  }

  - { name: WDT,             number: 24  }
  - { name: FMC,             number: 39  }
  - { name: SGPIO_MASTER,    number: 51  }
  - { name: UART_DMA,        number: 56  }
  - { name: SPI1_DMA,        number: 65  }
  - { name: SPI2_DMA,        number: 66  }

  # IRQ 88–90: SPI passthrough filters 1–3
  - { name: SPIPF1,          number: 88  }
  - { name: SPIPF2,          number: 89  }
  - { name: SPIPF3,          number: 90  }

  # IRQ 102–105: I3C 0–3
  - { name: I3C0,            number: 102 }
  - { name: I3C1,            number: 103 }
  - { name: I3C2,            number: 104 }
  - { name: I3C3,            number: 105 }

  # IRQ 110–123: I2C/SMBus 0–13
  - { name: I2C0,            number: 110 }
  - { name: I2C1,            number: 111 }
  - { name: I2C2,            number: 112 }
  - { name: I2C3,            number: 113 }
  - { name: I2C4,            number: 114 }
  - { name: I2C5,            number: 115 }
  - { name: I2C6,            number: 116 }
  - { name: I2C7,            number: 117 }
  - { name: I2C8,            number: 118 }
  - { name: I2C9,            number: 119 }
  - { name: I2C10,           number: 120 }
  - { name: I2C11,           number: 121 }
  - { name: I2C12,           number: 122 }
  - { name: I2C13,           number: 123 }

  - { name: SMBUS_FILTER,    number: 127 }
