# ASPEED AST2700 Secondary Service Processor (SSP) chip definition.
#
# The SSP is an ARM Cortex-M4F coprocessor embedded in the AST2700 BMC SoC.
# It runs alongside the primary CA35 processor.  All addresses below are in
# the CM4F view.
#
# Key differences from AST2600 (see ROADMAP.md "AST2700 Design Notes"):
# - Core: Cortex-M4F (ARMv7E-M with FPU + DSP)
# - SCU base (CM4F view): 0x72C0_2000 (different from AST2600's 0x7E6E_2000)
# - SSP control block: SCU0+0x120 = 0x72C0_2120
# - NVIC topology: 3-level cascade (see ROADMAP Task 20 / intc notes)
# - Cache area: split into I/D registers
# - Memory map: 8 registers for 3 windows (TCM, SRAM, DRAM)
# - GPR bank at 0x5000_0000
#
# Note: The interrupt_controllers field documents the cascaded INTC topology
# for reference.  Generator support for cascaded INTC is planned for Task 20.
# The PAC currently generates a flat 240-entry interrupt table which is correct
# for direct NVIC IRQ programming.
#
# Sources:
#   ast2700_ssp.pdf v0.1h
#   Zephyr: soc/aspeed/ast2700/ DTS files

name:               AST2700_SSP
family:             ast27xx
core:               cortex-m4f
target:             thumbv7em-none-eabihf
nvic_priority_bits: 3
num_irqs:           240

# ── Peripheral instances ──────────────────────────────────────────────────────

peripherals:
  # SSP coprocessor control (SCU0 + 0x120)
  - name:    SSP
    block:   ssp_v2::SSP
    address: 0x72c02120

  # GPR bank (CM4F private bus)
  - name:    GPR
    block:   gpr_v1::GPR
    address: 0x50000000

# ── Interrupt table ───────────────────────────────────────────────────────────
# AST2700 has a 3-level cascaded INTC. The IRQ numbers here are the CM4F
# NVIC lines, not the peripheral interrupt numbers. The cascaded INTC maps
# peripheral IRQs through software-visible controller IRQs. Only the top-level
# NVIC bindings are listed here; peripheral IRQ routing requires the INTC
# driver (future work).
#
# For the AST2700 legacy IPC compatibility registers (0x72100000),
# IRQs 144-158 are reserved for SSP/TSP communication.

interrupts:
  # Direct NVIC IRQs (from AST2700 SSP datasheet)
  - { name: TIMER1,         number: 16  }
  - { name: TIMER2,         number: 17  }
  - { name: TIMER3,         number: 18  }
  - { name: TIMER4,         number: 19  }
  - { name: TIMER5,         number: 20  }
  - { name: TIMER6,         number: 21  }
  - { name: TIMER7,         number: 22  }
  - { name: TIMER8,         number: 23  }
  - { name: WDT,            number: 24  }
  - { name: GPIO,           number: 40  }
  - { name: UART1,          number: 47  }
  - { name: UART2,          number: 48  }
  - { name: UART3,          number: 49  }
  - { name: UART4,          number: 50  }
  - { name: UART5,          number: 51  }
  - { name: UART6,          number: 52  }
  - { name: UART7,          number: 53  }
  - { name: UART8,          number: 54  }
  # Cascaded INTC controller IRQs (160-165 for INTC0 inputs)
  - { name: INTC0,          number: 160 }
  - { name: INTC1,          number: 161 }
  - { name: INTC2,          number: 162 }
  - { name: INTC3,          number: 163 }
  - { name: INTC4,          number: 164 }
  - { name: INTC5,          number: 165 }
  # Legacy IPC (BMC↔SSP 7 channels + BMC↔TSP 7 channels)
  - { name: IPC_SSP0,       number: 144 }
  - { name: IPC_SSP1,       number: 145 }
  - { name: IPC_SSP2,       number: 146 }
  - { name: IPC_SSP3,       number: 147 }
  - { name: IPC_SSP4,       number: 148 }
  - { name: IPC_SSP5,       number: 149 }
  - { name: IPC_SSP6,       number: 150 }
