# ASPEED AST2700 Secondary Service Processor (SSP) chip definition.
#
# The SSP is an ARM Cortex-M4F coprocessor embedded in the AST2700 BMC SoC.
# It runs alongside the primary CA35 processor.  All addresses below are in
# the CM4F view.
#
# Key differences from AST2600 (see ROADMAP.md "AST2700 Design Notes"):
# - Core: Cortex-M4F (ARMv7E-M with FPU + DSP)
# - SCU base (CM4F view): 0x72C0_2000 (different from AST2600's 0x7E6E_2000)
# - SSP control block: SCU0+0x120 = 0x72C0_2120
# - NVIC topology: 3-level cascade (see ROADMAP Task 20 / intc notes)
# - Cache area: split into I/D registers
# - Memory map: 8 registers for 3 windows (TCM, SRAM, DRAM)
# - GPR bank at 0x5000_0000
#
# Note: The interrupt_controllers field documents the cascaded INTC topology
# for reference.  Generator support for cascaded INTC is planned for Task 20.
# The PAC currently generates a flat 240-entry interrupt table which is correct
# for direct NVIC IRQ programming.
#
name:               AST2700_SSP
family:             ast27xx
core:               cortex-m4f
target:             thumbv7em-none-eabihf
nvic_priority_bits: 3
num_irqs:           240

# ── Peripheral instances ──────────────────────────────────────────────────────

peripherals:
  # SSP coprocessor control (SCU0 + 0x120)
  - name:    SSP
    block:   ssp_v2::SSP
    address: 0x72c02120

  # GPR bank (CM4F private bus)
  - name:    GPR
    block:   gpr_v1::GPR
    address: 0x50000000

  # ── Core service peripherals ───────────────────────────────────────────────

  - name:    TIMER0
    block:   timer_v1::TIMER
    address: 0x72c10000
    description: "CPU-die timer block"

  - name:    UART4
    block:   uart_v1::UART
    address: 0x72c1a000
    description: "CPU-die UART4"

  - name:    UART6
    block:   uart_v1::UART
    address: 0x74c33500
    description: "IO-die UART6"

  - name:    GPIO0
    block:   gpio_v1::GPIO
    address: 0x72c11000
    description: "CPU-die GPIO bank"

  - name:    GPIO1
    block:   gpio_v1::GPIO
    address: 0x74c0b000
    description: "IO-die GPIO bank"

  - name:    WDT0
    block:   wdt_ast2700_v1::WDT
    address: 0x74c37000
    description: "IO-die watchdog timer 0"

  - name:    ADC0
    block:   adc_v1::ADC
    address: 0x74c00000
    description: "IO-die ADC bank 0"

  - name:    ADC1
    block:   adc_v1::ADC
    address: 0x74c00100
    description: "IO-die ADC bank 1"

  - name:    IPC0
    block:   ipc0_v1::IPC0
    address: 0x72c1c000
    description: "IPC0 data-channel bus"

  # ── Interrupt controllers ─────────────────────────────────────────────────
  #
  # CPU-die INTCG global: routes CPU-die IRQs to SSP/TSP/PSP/BootMCU.
  - name:    INTCG
    block:   intcg_ast2700_v1::INTCG
    address: 0x72100000
    description: "CPU-die interrupt routing controller (INTCG)"

  # IO-die INTC1G global: routes IO-die IRQs to SSP/TSP/PSP/BootMCU.
  - name:    INTC1G
    block:   intcg_ast2700_v1::INTC1G
    address: 0x74c18000
    description: "IO-die interrupt routing controller (INTC1G)"

  # INTC0_11: CPU-die level-1 aggregator (NVIC IRQ 160-165).
  # Parent of all INTC1_x IO-die second-level controllers.
  - name:    INTC0_11
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x72102b00
    description: "CPU-die L1 aggregator (NVIC 160-165, parent of INTC1_x)"

  # INTC1_0 through INTC1_5: IO-die level-2 aggregators.
  # Each aggregates up to 32 IO-die peripheral IRQs into one INTC0_11 bit.
  - name:    INTC1_0
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c18180
    description: "IO-die L2 aggregator 0 (parent bit 0 of INTC0_11)"

  - name:    INTC1_1
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c18190
    description: "IO-die L2 aggregator 1 (parent bit 1 of INTC0_11)"

  - name:    INTC1_2
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c181a0
    description: "IO-die L2 aggregator 2 (parent bit 2 of INTC0_11)"

  - name:    INTC1_3
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c181b0
    description: "IO-die L2 aggregator 3 (parent bit 3 of INTC0_11)"

  - name:    INTC1_4
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c181c0
    description: "IO-die L2 aggregator 4 (parent bit 4 of INTC0_11)"

  - name:    INTC1_5
    block:   intc_ic_ast2700_v1::INTC_IC
    address: 0x74c181d0
    description: "IO-die L2 aggregator 5 (parent bit 5 of INTC0_11)"

# ── Interrupt table ───────────────────────────────────────────────────────────
# AST2700 has a 3-level cascaded INTC. The IRQ numbers here are the CM4F
# NVIC lines, not the peripheral interrupt numbers. The cascaded INTC maps
# peripheral IRQs through software-visible controller IRQs. Only the top-level
# NVIC bindings are listed here; peripheral IRQ routing requires the INTC
# driver (future work).
#
# For the AST2700 legacy IPC compatibility registers (0x72100000),
# IRQs 144-158 are reserved for SSP/TSP communication.

interrupts:
  # Direct NVIC IRQs
  - { name: TIMER1,         number: 16  }
  - { name: TIMER2,         number: 17  }
  - { name: TIMER3,         number: 18  }
  - { name: TIMER4,         number: 19  }
  - { name: TIMER5,         number: 20  }
  - { name: TIMER6,         number: 21  }
  - { name: TIMER7,         number: 22  }
  - { name: TIMER8,         number: 23  }
  - { name: WDT,            number: 24  }
  - { name: GPIO,           number: 40  }
  - { name: UART1,          number: 47  }
  - { name: UART2,          number: 48  }
  - { name: UART3,          number: 49  }
  - { name: UART4,          number: 50  }
  - { name: UART5,          number: 51  }
  - { name: UART6,          number: 52  }
  - { name: UART7,          number: 53  }
  - { name: UART8,          number: 54  }
  # Cascaded INTC controller IRQs (160-165 for INTC0 inputs)
  - { name: INTC0,          number: 160 }
  - { name: INTC1,          number: 161 }
  - { name: INTC2,          number: 162 }
  - { name: INTC3,          number: 163 }
  - { name: INTC4,          number: 164 }
  - { name: INTC5,          number: 165 }
  # Legacy IPC (BMC↔SSP 7 channels + BMC↔TSP 7 channels)
  - { name: IPC_SSP0,       number: 144 }
  - { name: IPC_SSP1,       number: 145 }
  - { name: IPC_SSP2,       number: 146 }
  - { name: IPC_SSP3,       number: 147 }
  - { name: IPC_SSP4,       number: 148 }
  - { name: IPC_SSP5,       number: 149 }
  - { name: IPC_SSP6,       number: 150 }
